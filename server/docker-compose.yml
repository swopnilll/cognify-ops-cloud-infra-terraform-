# What runs on the EC2 server. Copied there by scripts/deploy-api.sh.
#
# The images are built on a laptop and loaded onto the server, so the server
# never compiles anything. Only the API is reachable from outside (port 80).
# Postgres and the embedding worker are private to the Docker network.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: cognify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cognify
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognify -d cognify"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  api:
    image: cognify-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://cognify:${POSTGRES_PASSWORD}@db:5432/cognify
      DIRECT_URL: postgresql://cognify:${POSTGRES_PASSWORD}@db:5432/cognify
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      # No AWS keys: the SDK gets temporary credentials from the instance role.
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
    logging: *logging

  embedding:
    image: cognify-embedding:latest
    restart: unless-stopped
    depends_on:
      api: # the API applies the database migrations on start-up
        condition: service_started
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://cognify:${POSTGRES_PASSWORD}@db:5432/cognify
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
    logging: *logging

volumes:
  pgdata:
