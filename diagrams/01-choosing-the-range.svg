<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-label="The three private IPv4 ranges and why the Cognify VPC uses 10.30.0.0/16">
<title>The three private IPv4 ranges and why the Cognify VPC uses 10.30.0.0/16</title>
<rect width="1100" height="500" fill="#fff"/>
<rect x="30" y="20" width="1040" height="130" rx="6" fill="#F2F6E8" stroke="#7AA116" stroke-width="2"/>
<text x="54" y="60" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" text-anchor="start" fill="#232F3E">10.0.0.0/8</text>
<text x="54" y="82" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#5F6B7A">16.7 million addresses</text>
<text x="1046" y="56" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end" fill="#7AA116">CHOSEN</text>
<rect x="54" y="96" width="199.6" height="42" rx="4" fill="#fff" stroke="#D5DBDB" stroke-width="2"/>
<text x="68" y="114" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" text-anchor="start" fill="#232F3E">10.0.0.0/16</text>
<text x="68" y="131" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#5F6B7A">the default everyone picks</text>
<rect x="267.6" y="96" width="206.2" height="42" rx="4" fill="#fff" stroke="#D5DBDB" stroke-width="2"/>
<text x="281.6" y="114" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" text-anchor="start" fill="#232F3E">10.20.0.0/16</text>
<text x="281.6" y="131" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#5F6B7A">already used by another VPC</text>
<rect x="487.8" y="96" width="150.39999999999998" height="42" rx="4" fill="#8C4FFF" stroke="#8C4FFF" stroke-width="2"/>
<text x="501.8" y="114" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" text-anchor="start" fill="#fff">10.30.0.0/16</text>
<text x="501.8" y="131" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#fff">the Cognify VPC</text>
<rect x="652.2" y="96" width="170.79999999999998" height="42" rx="4" fill="#fff" stroke="#D5DBDB" stroke-width="2"/>
<text x="666.2" y="114" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" text-anchor="start" fill="#232F3E">10.40, 10.50 …</text>
<text x="666.2" y="131" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#5F6B7A">free for future VPCs</text>
<rect x="30" y="170" width="1040" height="130" rx="6" fill="#FDF0EC" stroke="#D13212" stroke-width="2"/>
<text x="54" y="210" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" text-anchor="start" fill="#232F3E">172.16.0.0/12</text>
<text x="54" y="232" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#5F6B7A">1 million addresses</text>
<text x="1046" y="206" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end" fill="#D13212">AVOIDED: clashes with Docker</text>
<rect x="54" y="246" width="232.6" height="42" rx="4" fill="#fff" stroke="#D5DBDB" stroke-width="2"/>
<text x="68" y="264" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" text-anchor="start" fill="#232F3E">172.17.0.0/16</text>
<text x="68" y="281" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#5F6B7A">Docker's default bridge network</text>
<rect x="300.6" y="246" width="305.2" height="42" rx="4" fill="#fff" stroke="#D5DBDB" stroke-width="2"/>
<text x="314.6" y="264" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" text-anchor="start" fill="#232F3E">172.18 – 172.31</text>
<text x="314.6" y="281" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#5F6B7A">taken by Docker Compose networks, one each</text>
<rect x="30" y="320" width="1040" height="130" rx="6" fill="#FDF0EC" stroke="#D13212" stroke-width="2"/>
<text x="54" y="360" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" text-anchor="start" fill="#232F3E">192.168.0.0/16</text>
<text x="54" y="382" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#5F6B7A">65,536 addresses</text>
<text x="1046" y="356" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end" fill="#D13212">AVOIDED: clashes with home networks</text>
<rect x="54" y="396" width="170.79999999999998" height="42" rx="4" fill="#fff" stroke="#D5DBDB" stroke-width="2"/>
<text x="68" y="414" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" text-anchor="start" fill="#232F3E">192.168.0.0/24</text>
<text x="68" y="431" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#5F6B7A">most home routers</text>
<rect x="238.79999999999998" y="396" width="170.79999999999998" height="42" rx="4" fill="#fff" stroke="#D5DBDB" stroke-width="2"/>
<text x="252.79999999999998" y="414" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" text-anchor="start" fill="#232F3E">192.168.1.0/24</text>
<text x="252.79999999999998" y="431" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#5F6B7A">most of the rest</text>
<text x="30" y="482" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#5F6B7A" font-style="italic">A VPC must use private (RFC 1918) space. Two networks can only be connected if their ranges do not overlap.</text>
</svg>
