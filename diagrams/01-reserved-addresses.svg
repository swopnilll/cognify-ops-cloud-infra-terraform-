<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="The five addresses AWS reserves in every subnet, shown for 10.30.0.0/24">
<title>The five addresses AWS reserves in every subnet, shown for 10.30.0.0/24</title>
<rect width="1000" height="250" fill="#fff"/>
<text x="40" y="36" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#232F3E">public-a</text>
<text x="122" y="36" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="700" text-anchor="start" fill="#232F3E">10.30.0.0/24</text>
<text x="262" y="36" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5F6B7A">256 addresses − 5 reserved by AWS = 251 usable</text>
<rect x="40" y="70" width="90" height="64" rx="0" fill="#FDF0EC" stroke="#D13212" stroke-width="2"/>
<text x="85.0" y="110" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="700" text-anchor="middle" fill="#232F3E">.0</text>
